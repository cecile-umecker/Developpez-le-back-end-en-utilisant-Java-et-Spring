spring.application.name=api
spring.datasource.url=jdbc:mysql://localhost:3306/rentalDB?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=chatop_user
spring.datasource.password=Azerty1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

server.servlet.context-path=/api

# Taille maximum des fichiers
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Répertoire de stockage des fichiers
app.upload.dir=uploads

# Configuration pour les ressources statiques (optionnel)
spring.web.resources.static-locations=file:uploads/
spring.web.resources.add-mappings=true